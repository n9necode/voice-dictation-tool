[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-dictation-tool"
version = "0.1.0"
description = "Voice plugin for talking with the Kimi K3 model"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "demar" }]
license = "MIT"
keywords = ["kimi", "kimi-k3", "voice", "speech"]

[project.scripts]
voice-dictation-tool = "voice_dictation_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/voice-dictation-tool"}

[tool.setuptools.packages.find]
where = ["skills/voice-dictation-tool"]
